            drum3.classList.add('is-spinning');

            audio.play();

            let steps = 0;

                drum1.textContent = words1[Math.floor(Math.random() * words1.length)];
                drum2.textContent = words2[Math.floor(Math.random() * words2.length)];
                drum3.textContent = words3[Math.floor(Math.random() * words3.length)];

                if (steps >= 15) {
                    clearInterval(interval);

                    drum1.classList.remove('is-spinning');
                    drum2.classList.remove('is-spinning');
                    drum3.classList.remove('is-spinning');

                    clearInterval(bulbInterval);
                    garland.classList.add('celebrate');
                    setTimeout(() => {
                        garland.classList.remove('celebrate');
                        bulbInterval = setInterval(switchBulb, delay);
                    }, 1800);
                }
            }, 50);
        });

        let i = 0;
        const delay = 100;

        function switchBulb() {
            bulbs.forEach(b => b.classList.remove('active'));

            bulbs[i].classList.add('active');
            i++;

            if (i >= bulbs.length) {

            }
        }
